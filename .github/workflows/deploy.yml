name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Docs and GitHub templates don't change the site.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
  # Pull requests (Dependabot included) run tests and the build; only main deploys.
  pull_request:
  workflow_dispatch:
    inputs:
      refresh:
        description: Refetch live data even if today's is cached
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *' # daily refresh of public/data and public/badges

permissions:
  contents: read

# Public URL of the site; the base path, canonical/OG links, sitemap, robots.txt, llms.txt and badges
# all derive from it. Defaults to site.config.ts; a repository variable SITE_URL overrides it.
env:
  SITE_URL: ${{ vars.SITE_URL }}
  # The badge service's URL (server/, deployed by Railway from main). Unset: README badges only for tracked packages.
  BADGE_API_URL: ${{ vars.BADGE_API_URL }}

# One deployment at a time; let an in-flight production deploy finish.
concurrency:
  # Pull requests get their own group (a newer push cancels the older check); deploys queue in "pages".
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # a stuck API must not hold the runner for the 6-hour default
    steps:
      # Actions are pinned to commit SHAs: a moved tag can't change what runs next to BADGE_SYNC_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false # nothing here pushes; the GitHub token needn't stay on disk
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Live data (~150 packages, several minutes) is fetched at most once a day (UTC). Pushes reuse today's
      # cached copy; the nightly schedule, a manual "refresh" run, or the first build of a day fetch it.
      # The key hashes the code and lists that shape the data, so a build never prerenders numbers from another model
      # or format, and a new blocklist entry refetches instead of shipping today's files with the name still in them.
      - id: data
        run: echo "key=data-$(date -u +%F)-${{ hashFiles('src/core/estimate.ts', 'src/core/insights.ts', 'src/core/sources.ts', 'src/core/lists.ts', 'scripts/build-data.mjs', 'scripts/data-lib.ts', 'data/seeds.json', 'data/blocklist.json', 'data/compare.json') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            public/data
            public/badges
          key: ${{ steps.data.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.data.outputs.key }}-
      - id: fetch
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name == 'schedule' || inputs.refresh || steps.cache.outputs.cache-matched-key == '')
        run: npm run data
        env:
          # Reads the badge service's request log (GET /requested). Unset: the badge list just stays as it was.
          BADGE_SYNC_TOKEN: ${{ secrets.BADGE_SYNC_TOKEN }}
      - if: steps.fetch.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            public/data
            public/badges
          key: ${{ steps.data.outputs.key }}-${{ github.run_id }}

      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      # Tell Bing and other IndexNow engines about the URLs. Not on the nightly refresh: resubmitting everything
      # every day reads as spam. The key is public by design and proven by public/<key>.txt.
      - if: github.event_name != 'schedule'
        continue-on-error: true
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
          KEY: 73dc13e3e79131cf2200e345c32794a0
        run: |
          host=$(echo "$SITE" | sed -E 's|https?://([^/]+).*|\1|')
          curl -fsS "${SITE%/}/sitemap.xml" | grep -oP '(?<=<loc>)[^<]+' \
            | jq -R . | jq -s --arg host "$host" --arg key "$KEY" '{host: $host, key: $key, urlList: .}' \
            | curl -sS -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' -d @-
