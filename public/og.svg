<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source art for og.png (export at 1200x630 with Caveat, Atkinson Hyperlegible and JetBrains Mono installed). -->
  <defs>
    <pattern id="lines" width="1200" height="35" patternUnits="userSpaceOnUse">
      <path d="M0 34H1200" fill="none" stroke="#2D52E0" stroke-opacity="0.12" stroke-width="1.5"/>
    </pattern>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-41)">
      <path d="M0 0V12" stroke="#2D52E0" stroke-opacity="0.45" stroke-width="2.4"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#FFFEF9"/>
  <rect width="1200" height="630" fill="url(#lines)"/>
  <path d="M84 0V630" stroke="#D64678" stroke-opacity="0.3" stroke-width="3"/>

  <g font-family="Caveat, 'Segoe Print', 'Bradley Hand', cursive" font-weight="700">
    <text x="130" y="168" font-size="150" fill="#1E2333" transform="rotate(-1.5 130 168)">human<tspan fill="#2D52E0">loads</tspan></text>
    <g fill="none" stroke="#2D52E0" stroke-linecap="round" transform="rotate(-1.5 130 168)">
      <path d="M492 190 C 600 185, 720 193, 846 186" stroke-width="5"/>
      <path d="M508 204 C 610 199, 730 206, 832 199" stroke-width="4"/>
    </g>
  </g>
  <text x="134" y="244" font-family="'Atkinson Hyperlegible', 'Segoe UI', sans-serif" font-size="36" fill="#545B6E">npm counts every tarball fetch. We estimate the real installs.</text>

  <!-- The two cards: npm crossed out in pencil, real installs in blue ballpoint. -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-weight="600">
    <rect x="134" y="300" width="420" height="190" rx="18" fill="#FFFFFF" fill-opacity="0.75" stroke="#9AA0AE" stroke-width="3" stroke-dasharray="12 8" transform="rotate(-1 344 395)"/>
    <text x="164" y="356" font-family="Caveat, cursive" font-weight="700" font-size="46" fill="#545B6E">npm says</text>
    <text x="164" y="440" font-size="60" fill="#545B6E">1,204,880</text>
    <path d="M150 428 L 500 410" stroke="#1E2333" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>

    <rect x="596" y="304" width="470" height="200" rx="18" fill="#2D52E0" fill-opacity="0.12" transform="rotate(0.6 831 404)"/>
    <rect x="592" y="296" width="470" height="200" rx="18" fill="#FFFFFF" stroke="#2D52E0" stroke-width="4" transform="rotate(0.6 827 396)"/>
    <text x="624" y="354" font-family="Caveat, cursive" font-weight="700" font-size="46" fill="#1F3A93">real installs</text>
    <rect x="660" y="408" width="250" height="34" fill="#FFE45C" transform="rotate(-1 785 425)"/>
    <text x="624" y="440" font-size="60" fill="#1E2333">≈ 3–9k</text>
    <text x="624" y="478" font-family="'Atkinson Hyperlegible', sans-serif" font-weight="400" font-size="23" fill="#545B6E">a week, with a range and a confidence</text>
  </g>

  <!-- Chart strip along the bottom: the npm pencil dashes over the human ballpoint line. -->
  <path d="M134 600 L 1100 600" stroke="#1E2333" stroke-width="3" stroke-linecap="round"/>
  <path d="M134 594 L 220 580 L 300 548 L 360 590 L 430 530 L 520 576 L 600 512 L 690 566 L 780 540 L 860 584 L 950 520 L 1030 560 L 1100 536" fill="none" stroke="#9AA0AE" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M134 597 L 1100 597 L 1100 584 C 1000 586, 900 583, 800 586 S 600 585, 500 588 S 300 590, 134 592 Z" fill="url(#hatch)"/>
  <path d="M134 595 C 300 592, 450 591, 600 589 S 900 585, 1100 584" fill="none" stroke="#2D52E0" stroke-width="7" stroke-linecap="round"/>
</svg>
